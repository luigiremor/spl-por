[package]
name = "sum-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Merkle sum tree, MMR accumulator and canonical attestation serialization for a proof-of-reserves PoC"

[lib]
name = "sum_tree"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
