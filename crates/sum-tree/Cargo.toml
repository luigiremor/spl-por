[package]
name = "sum-tree"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Merkle sum tree, MMR accumulator and canonical attestation serialization for a proof-of-reserves PoC"

[lib]
name = "sum_tree"

[features]
default = ["manifest"]
manifest = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
