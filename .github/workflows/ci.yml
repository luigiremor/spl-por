name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honors rust-toolchain.toml; this installs the pinned toolchain.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Solana CLI (Agave) + Anchor CLI at the versions recorded in results/run-meta.toml
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.17/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: System libraries for anchor-cli (hidapi needs libudev)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libssl-dev
      - name: Cache Anchor CLI
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-0.32.1-${{ runner.os }}
      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked
      - run: solana --version && anchor --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the LiteSVM tests of programs/por load target/deploy/por.so
      - run: anchor build
      - run: cargo test --workspace
