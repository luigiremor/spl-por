name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup honors rust-toolchain.toml; this installs the pinned toolchain.
      - run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Solana CLI (Agave) + Anchor CLI at the versions recorded in results/run-meta.toml
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.17/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        run: npm i -g @coral-xyz/anchor-cli@0.32.1
      - run: solana --version && anchor --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the LiteSVM tests of programs/por load target/deploy/por.so
      - run: anchor build
      - run: cargo test --workspace
