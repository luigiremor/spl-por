[package]
name = "scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Evaluation harness for spl-por: deterministic datasets, scenario matrix S01-S16, measurements (not part of the contribution)"

[[bin]]
name = "por-gen"
path = "src/bin/por_gen.rs"

[[bin]]
name = "por-measure"
path = "src/bin/por_measure.rs"

[[bin]]
name = "por-devnet-run"
path = "src/bin/por_devnet_run.rs"

[dependencies]
sum-tree = { path = "../crates/sum-tree" }
attester = { path = "../crates/attester" }
verifier = { path = "../crates/verifier" }
por = { path = "../programs/por", features = ["no-entrypoint"] }
anchor-lang = "0.32.1"
solana-sdk = "2.3"
solana-client = "2.3"
solana-ed25519-program = "2.2"
solana-system-interface = { version = "1", features = ["bincode"] }
spl-token = { version = "8", features = ["no-entrypoint"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
base64 = "0.22"
bincode = "1"
time = { version = "0.3", features = ["formatting"] }
